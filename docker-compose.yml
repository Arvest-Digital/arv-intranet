services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: arv
      POSTGRES_PASSWORD: arv
      POSTGRES_DB: arv
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arv -d arv"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
