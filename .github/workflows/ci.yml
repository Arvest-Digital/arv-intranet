name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: arv
          POSTGRES_PASSWORD: arv
          POSTGRES_DB: arv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arv -d arv_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://arv:arv@localhost:5432/arv_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Service containers take no command: raise max_connections like docker-compose.yml does
      # (workerd keeps every socket of an integration test file open until the file ends).
      - name: Raise Postgres max_connections
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U arv -d arv_test -c "ALTER SYSTEM SET max_connections = 300"
          docker restart ${{ job.services.postgres.id }}
          until docker exec ${{ job.services.postgres.id }} pg_isready -U arv -d arv_test; do sleep 1; done

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration

      - run: pnpm --filter @arv/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
